name: Release

# Manual trigger. Builds, signs with Developer ID, notarises, staples, verifies and only then
# creates the GitHub Release. It fails closed: if any credential is missing or any check fails,
# nothing is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal MARKETING_VERSION in the project (e.g. 1.0.0)"
        required: true

# Toolchain pin: bump deliberately. Reproducibility holds per Xcode version (see docs/RELEASING.md).
env:
  PINNED_XCODE: "26.6"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Signing secrets live in this Environment, which should require a reviewer (docs/RELEASING.md).
    environment: release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight - required secrets present
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in DEVELOPER_ID_CERT_BASE64 DEVELOPER_ID_CERT_PASSWORD DEVELOPER_ID_IDENTITY \
                      APPLE_TEAM_ID NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          [ "$missing" = 0 ] || { echo "See docs/RELEASING.md. Nothing was built or published."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

      - name: Select the pinned Xcode
        run: |
          XCODE="/Applications/Xcode_${PINNED_XCODE}.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE is not on this runner image. Bump PINNED_XCODE (and the runner label) deliberately."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          [ "$(xcodebuild -version | head -1)" = "Xcode ${PINNED_XCODE}" ] || { echo "::error::Wrong Xcode selected"; exit 1; }
          xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild -project StorageBar.xcodeproj -scheme StorageBar \
            -derivedDataPath "$RUNNER_TEMP/dd-test" -only-testing:StorageBarTests test \
            | tee "$RUNNER_TEMP/unit.log" | grep -E "Test run with|\*\* TEST|error:" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/unit.log"

      - name: Import signing certificate into a temporary keychain
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf %s "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      - name: Build, sign, notarise, staple, package and verify
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          REQUIRE_NOTARIZATION: "1"
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          umask 077
          printf %s "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          scripts/build-release.sh
          test -f dist/StorageBar.dmg   # only a notarised build is named StorageBar.dmg

      - name: Re-verify the artefact immediately before publishing
        run: |
          shasum -a 256 -c dist/StorageBar.dmg.sha256 --status || (cd dist && shasum -a 256 -c StorageBar.dmg.sha256)
          xcrun stapler validate dist/StorageBar.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/StorageBar.dmg
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION appeared during the build"; exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/StorageBar.dmg dist/StorageBar.dmg.sha256 \
            --target "$GITHUB_SHA" --title "StorageBar $VERSION" --generate-notes

      - name: Remove credentials from the runner
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
