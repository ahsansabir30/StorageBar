name: Unsigned pre-release

# Manual trigger. Publishes a clearly labelled UNSIGNED, NOT NOTARISED pre-release so technical users
# can download StorageBar without building it. macOS will warn on first open (see the release notes).
# Integrity comes from the public source, a reproducible build and a GitHub build-provenance
# attestation, not from Apple. No secrets are used; only the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal MARKETING_VERSION in the project (e.g. 1.0.0)"
        required: true

# Toolchain pin: bump deliberately. Reproducibility holds per Xcode version (see docs/RELEASING.md).
env:
  PINNED_XCODE: "26.6"

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation (Sigstore)
      attestations: write    # store the attestation
    env:
      VERSION: ${{ inputs.version }}
      TAG: unsigned-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version and tag
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi

      - name: Select the pinned Xcode
        run: |
          XCODE="/Applications/Xcode_${PINNED_XCODE}.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE is not on this runner image. Bump PINNED_XCODE (and the runner label) deliberately."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          [ "$(xcodebuild -version | head -1)" = "Xcode ${PINNED_XCODE}" ] || { echo "::error::Wrong Xcode selected"; exit 1; }
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          xcodebuild -project StorageBar.xcodeproj -scheme StorageBar \
            -derivedDataPath "$RUNNER_TEMP/dd-test" -only-testing:StorageBarTests test \
            | tee "$RUNNER_TEMP/unit.log" | grep -E "Test run with|\*\* TEST|error:" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/unit.log"

      - name: Reproducibility - two independent builds must be byte-identical
        run: scripts/verify-reproducible.sh

      - name: Build, run the security assertions and package the DMG
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          scripts/build-release.sh
          cp "dist/StorageBar-$VERSION-LOCAL-UNSIGNED.dmg" "dist/StorageBar-$VERSION-unsigned.dmg"
          ( cd dist && shasum -a 256 "StorageBar-$VERSION-unsigned.dmg" > "StorageBar-$VERSION-unsigned.dmg.sha256" )
          ls -la dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/StorageBar-${{ inputs.version }}-unsigned.dmg

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## StorageBar $VERSION (unsigned pre-release)"
            echo
            echo "**This build is not signed with an Apple Developer ID and is not notarised.** macOS will warn"
            echo "the first time you open it. Only install it if you trust this repository."
            echo
            echo "### Install"
            echo "1. Download \`StorageBar-$VERSION-unsigned.dmg\`, open it and drag **StorageBar** into **Applications**."
            echo "2. Open StorageBar. macOS says it cannot verify the app: click **Done** (not Move to Bin)."
            echo "3. Open **System Settings > Privacy & Security**, scroll to **Security**, and click **Open Anyway**"
            echo "   next to the StorageBar message. Confirm with your password or Touch ID."
            echo "4. Open StorageBar again. This approval is needed once and is the standard macOS route for apps"
            echo "   from developers who are not enrolled with Apple. Do not disable Gatekeeper."
            echo
            echo "### Verify before installing"
            echo '```'
            echo "shasum -a 256 -c StorageBar-$VERSION-unsigned.dmg.sha256"
            echo "gh attestation verify StorageBar-$VERSION-unsigned.dmg -R $REPO"
            echo '```'
            echo "The attestation proves this file was built by this repository's workflow from commit"
            echo "\`$COMMIT\`, using $XCODE_VERSION. The build is reproducible for that Xcode version:"
            echo "\`scripts/verify-reproducible.sh\` shows two independent builds are byte-identical."
            echo
            echo "Requires macOS 15 or later on Apple silicon. StorageBar has no network access and reads only"
            echo "the capacity of your startup disk. See SECURITY.md."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            "dist/StorageBar-$VERSION-unsigned.dmg" "dist/StorageBar-$VERSION-unsigned.dmg.sha256" \
            --target "$COMMIT" --prerelease --title "StorageBar $VERSION (unsigned)" \
            --notes-file "$RUNNER_TEMP/notes.md"
